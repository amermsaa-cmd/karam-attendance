<style>
  :root {
    color-scheme: dark;
    --navy: #26275D;
    --navy-deep: #1c1d47;
    --cream: #FEECD9;
    --cream-dim: rgba(254,236,217,0.55);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 30%, var(--navy) 0%, var(--navy-deep) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    overflow: hidden;
  }
  .card { text-align: center; animation: fadeUp .6s ease both; }
  .logo {
    width: 128px; height: 128px; border-radius: 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    animation: pop .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .greet { margin-top: 22px; color: var(--cream); font-size: 19px; font-weight: 600; }
  .sub { margin-top: 8px; color: var(--cream-dim); font-size: 14px; }
  .dots { margin-top: 20px; display: flex; gap: 6px; justify-content: center; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--cream);
    opacity: .3; animation: blink 1.1s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
  .install-btn {
    margin-top: 24px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--cream);
    color: var(--navy-deep);
    border: none;
    border-radius: 14px;
    padding: 13px 26px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    animation: fadeUp .4s ease both;
  }
  .install-btn:active { transform: scale(.97); }
  .install-note { margin-top: 12px; color: var(--cream-dim); font-size: 12.5px; }
</style>
</head>
