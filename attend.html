<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e9e50">
  <title>تسجيل الحضور</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      direction: rtl;
      background: #f4f6f8;
      overflow: hidden;
    }

    /* ==== شريط التبويبات: هذه الصفحة أصبحت الصفحة الرئيسية (بدل Hub.html) ====
       التبويب "الحضور والانصراف" محتوى حقيقي داخل هذه الصفحة نفسها (مش رابط
       خروج ولا iframe) عشان صلاحية GPS تفضل شغالة. تبويب "مهامي اليومية"
       (ولو المستخدم مشرف: "تقريري اليومي" و"إضافة مهام") تُعرض داخل iframe
       عادي لأنها مش محتاجة صلاحية الموقع إطلاقاً، فمفيش أي مشكلة تحميلها
       بداخل هذه الصفحة. التنقّل بين التبويبات هنا كله محلي (JS) بدون أي
       خروج فعلي من الصفحة. */
    .tabs {
      display: flex;
      background: #1e9e50;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
    }
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 14px 2px;
      color: #d7f7e4;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      cursor: pointer;
      border-bottom: 4px solid transparent;
      user-select: none;
    }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: #ffd54f;
      background: rgba(255,255,255,0.08);
      font-weight: 800;
    }

    .frame-wrap {
      position: fixed;
      top: 58px; left: 0; right: 0; bottom: 0;
    }
    .pane {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
    }
    .pane.active { display: block; }
    #pane-attend.active { overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* بطاقة الحضور - نفس التصميم السابق بالضبط */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px 20px;
      max-width: 420px;
      margin: 20px auto;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 22px; margin: 0 0 4px; color: #222; }
    .date-time { color: #888; font-size: 14px; margin-bottom: 20px; }

    .toggle-group {
      display: flex;
      background: #eee;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 14px;
    }
    .toggle-group button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 4px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      color: #555;
    }
    .toggle-group button.active {
      background: #fff;
      font-weight: bold;
      color: #1a73e8;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    select {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-bottom: 14px;
      display: none;
    }

    .btn {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-in { background: #1e9e50; }
    .btn-out { background: #d93025; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .status {
      margin-top: 14px;
      font-size: 14px;
      padding: 10px;
      border-radius: 10px;
      display: none;
      white-space: pre-line;
      line-height: 1.6;
    }
    .status.ok { background: #e6f4ea; color: #1e6b34; display: block; }
    .status.err { background: #fce8e6; color: #a50e0e; display: block; }
    .status.info { background: #e8f0fe; color: #174ea6; display: block; }

    .loader {
      display: none;
      margin: 10px auto;
      width: 26px; height: 26px;
      border: 3px solid #ddd;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="tabs">
    <div class="tab-btn active" id="btn-attend" onclick="showTab('attend')">الحضور والانصراف</div>
    <div class="tab-btn" id="btn-mytasks" onclick="showTab('mytasks')">مهامي اليومية</div>
    <div class="tab-btn" id="btn-report" onclick="showTab('report')" style="display:none">تقريري اليومي</div>
    <div class="tab-btn" id="btn-tasks" onclick="showTab('tasks')" style="display:none">إضافة مهام</div>
  </div>

  <div class="frame-wrap">
    <div id="pane-attend" class="pane active">
      <div class="card">
        <h1 id="empNameHeading">...</h1>
        <div class="date-time" id="clock"></div>

        <div class="toggle-group" id="typeToggle">
          <button type="button" class="active" data-type="عادي" onclick="selectType('عادي')">دوام عادي</button>
          <button type="button" data-type="تغطية" onclick="selectType('تغطية')">تغطية</button>
        </div>

        <select id="coverSelect">
          <option value="">اختر من تغطي...</option>
        </select>

        <div class="loader" id="loader" style="display:block"></div>

        <button class="btn btn-in" id="btnIn" style="display:none" onclick="doAction('in')">🟢 تسجيل الحضور</button>
        <button class="btn btn-out" id="btnOut" style="display:none" onclick="doAction('out')">🔴 تسجيل الانصراف</button>

        <div class="status" id="statusBox"></div>
      </div>
    </div>

    <iframe id="pane-mytasks" class="pane"></iframe>
    <iframe id="pane-report" class="pane"></iframe>
    <iframe id="pane-tasks" class="pane"></iframe>
  </div>

  <script>
    // ================================================================
    // هذه الصفحة هي الصفحة الرئيسية للموظف (بدل لوحة Hub.html على
    // Apps Script). تبويب "الحضور والانصراف" محتوى حقيقي داخل هذه الصفحة
    // نفسها (top-level على GitHub Pages)، عشان صلاحية GPS تفضل شغالة -
    // في وضع "مثبت كتطبيق" (standalone/fullscreen) خصوصًا، أندرويد يطبّق
    // قيودًا أشد على تفويض صلاحية الموقع داخل iframe متداخل من نطاق مختلف
    // (Apps Script)، وهذا بالضبط سبب ظهور المشكلة أصلاً بعد تفعيل التثبيت.
    //
    // تسجيل حضور/انصراف: يتم عبر تنقّل كامل (location.href) وليس عبر
    // iframe/postMessage أو fetch/JSONP - جُرِّبت كل هذه البدائل عمليًا
    // وفشلت (بعضها فشل على أجهزة محددة، والقناة المخفية عبر iframe فشلت
    // حتى على الحاسوب)، بينما التنقّل الكامل هو الوحيد الناجح 100% في كل
    // اختبار حقيقي حتى الآن. جوجل هترجع صفحة تأكيد بسيطة فيها زر رجوع
    // لهذه الصفحة (ظهورها لحظيًا أمر طبيعي ومتوقع). الرابط الراجع يحمل
    // ?hasOpen=1/0 دقيقة، فتظهر فورًا زر واحد صحيح بدون أي وميض.
    // ================================================================

    const API_BASE = 'https://script.google.com/macros/s/AKfycbwUsIteMnwV4j0uo0--eYbF5cGdcTjDm1mWaLVs3ZBQ7cmWKiE99gz_--D68aM0UAJN/exec';

    // نفس أسماء الموظفين المستخدمة في index.html — عدّل هنا لو أضفت/غيّرت موظفين
    const EMP_NAMES = { '1': 'محمد', '2': 'مشتاق', '3': 'مجيد' };
    // معرّفات المشرفين (يظهر لهم تبويبا "تقريري اليومي" و"إضافة مهام" إضافيين)
    const SUPERVISOR_IDS = ['3'];

    const params = new URLSearchParams(location.search);
    const EMP_ID = params.get('emp') || '';
    const EMP_NAME = EMP_NAMES[EMP_ID] || 'موظف غير معروف';
    const IS_SUPERVISOR = SUPERVISOR_IDS.indexOf(EMP_ID) !== -1;

    document.title = 'حضور ' + EMP_NAME;
    document.getElementById('empNameHeading').textContent = EMP_NAME;

    // تعبئة قائمة "من تغطي" بكل الموظفين ما عدا الموظف الحالي
    (function fillCoverSelect() {
      const sel = document.getElementById('coverSelect');
      Object.keys(EMP_NAMES).forEach(function (id) {
        if (id === EMP_ID) return;
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = EMP_NAMES[id];
        sel.appendChild(opt);
      });
    })();

    // ==== إدارة التبويبات (تنقّل محلي بدون خروج من الصفحة إطلاقًا) ====
    const TAB_NAMES = ['attend', 'mytasks'].concat(IS_SUPERVISOR ? ['report', 'tasks'] : []);
    const frameUrls = {
      mytasks: API_BASE + '?action=mytasks&emp=' + encodeURIComponent(EMP_ID),
      report: API_BASE + '?action=report&emp=' + encodeURIComponent(EMP_ID),
      tasks: API_BASE + '?action=admin'
    };
    const loadedFrames = { attend: true };

    if (IS_SUPERVISOR) {
      document.getElementById('btn-report').style.display = 'block';
      document.getElementById('btn-tasks').style.display = 'block';
    }

    function showTab(name) {
      TAB_NAMES.forEach(function (n) {
        document.getElementById('btn-' + n).classList.toggle('active', n === name);
        document.getElementById('pane-' + n).classList.toggle('active', n === name);
      });
      if (!loadedFrames[name] && frameUrls[name]) {
        document.getElementById('pane-' + name).src = frameUrls[name];
        loadedFrames[name] = true;
      }
    }

    let currentType = 'عادي';
    let coords = null;

    function selectType(t) {
      currentType = t;
      document.querySelectorAll('#typeToggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.type === t);
      });
      document.getElementById('coverSelect').style.display = (t === 'تغطية') ? 'block' : 'none';
    }

    function tickClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleDateString('ar-EG') + ' - ' + now.toLocaleTimeString('ar-EG');
    }
    setInterval(tickClock, 1000);
    tickClock();

    function getDeviceInfo() {
      return navigator.userAgent.substring(0, 120);
    }

    function showStatus(type, msg) {
      const box = document.getElementById('statusBox');
      box.className = 'status ' + type;
      box.textContent = msg;
    }

    function setLoading(on) {
      document.getElementById('loader').style.display = on ? 'block' : 'none';
      document.getElementById('btnIn').disabled = on;
      document.getElementById('btnOut').disabled = on;
    }

    function getLocationThen(callback) {
      if (!navigator.geolocation) {
        showStatus('err', 'المتصفح لا يدعم تحديد الموقع (GPS). لا يمكن التسجيل.');
        return;
      }
      setLoading(true);
      showStatus('info', 'جاري تحديد موقعك بدقة عالية...');

      function fail(err) {
        setLoading(false);
        var msg;
        if (err && err.code === 1) {
          msg = 'تم رفض صلاحية الموقع. يرجى تفعيل صلاحية الموقع لهذا الموقع من إعدادات المتصفح والمحاولة مرة أخرى.';
        } else if (err && err.code === 3) {
          msg = 'استغرق تحديد الموقع وقتاً طويلاً. جرّب الوقوف بمكان مفتوح (بعيداً عن الجدران) ثم أعد المحاولة.';
        } else {
          msg = 'تعذر تحديد الموقع. يرجى تفعيل صلاحية الموقع (GPS) والمحاولة مرة أخرى.';
        }
        showStatus('err', msg);
      }

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          callback();
        },
        function (err) {
          if (err && err.code === 3) {
            showStatus('info', 'إعادة المحاولة بدقة عادية...');
            navigator.geolocation.getCurrentPosition(
              function (pos) {
                coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                callback();
              },
              fail,
              { enableHighAccuracy: false, timeout: 15000, maximumAge: 30000 }
            );
          } else {
            fail(err);
          }
        },
        { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
      );
    }

    function doAction(kind) {
      if (kind === 'in' && currentType === 'تغطية' && !document.getElementById('coverSelect').value) {
        showStatus('err', 'يرجى اختيار الموظف الذي تريد تغطيته أولاً');
        return;
      }
      getLocationThen(function () {
        const qs = new URLSearchParams({
          action: kind === 'in' ? 'checkin' : 'checkout',
          emp: EMP_ID,
          type: currentType,
          coverFor: document.getElementById('coverSelect').value || '',
          lat: coords.lat,
          lng: coords.lng,
          device: getDeviceInfo()
        });
        showStatus('info', 'جاري الإرسال...');
        location.href = API_BASE + '?' + qs.toString();
      });
    }

    // ==== تحديد أي زر يظهر (حضور فقط أو انصراف فقط - أبدًا سويًا) ====
    // بعد كل عملية تسجيل، الرابط الراجع من Apps Script يحمل ?hasOpen=1/0
    // بشكل مؤكد (محسوبة طازجة من الخادم)، ونحتفظ بآخر حالة معروفة محليًا
    // (localStorage) لعرضها فورًا بدون أي وميض في كل مرة تُفتح فيها الصفحة
    // لاحقًا. فقط أول فتح إطلاقًا (بدون أي حالة محفوظة) يحتاج تنقّل قصير
    // وتلقائي للتحقق من الحالة الحقيقية.
    const LS_KEY = 'karam_hasOpen_' + EMP_ID;
    function saveHasOpen(v) {
      try { localStorage.setItem(LS_KEY, v ? '1' : '0'); } catch (e) {}
    }
    function loadHasOpen() {
      try { return localStorage.getItem(LS_KEY); } catch (e) { return null; }
    }
    function applyButtons(hasOpen) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('btnIn').style.display = hasOpen ? 'none' : 'block';
      document.getElementById('btnOut').style.display = hasOpen ? 'block' : 'none';
    }

    function refreshMyStatus() {
      const hasOpenParam = params.get('hasOpen');
      if (hasOpenParam === '1' || hasOpenParam === '0') {
        const val = hasOpenParam === '1';
        saveHasOpen(val);
        applyButtons(val);
        return;
      }
      const cached = loadHasOpen();
      if (cached === '1' || cached === '0') {
        applyButtons(cached === '1');
        return;
      }
      // أول فتح إطلاقًا بلا أي حالة محفوظة: تنقّل قصير وتلقائي للتحقق من
      // الحالة الحقيقية، ثم رجوع فوري لهذه الصفحة مع ?hasOpen= في الرابط.
      location.href = API_BASE + '?action=attendanceStatus&emp=' + encodeURIComponent(EMP_ID) + '&redirect=1';
    }

    if (!EMP_ID) {
      showStatus('err', 'رابط غير صحيح — يجب أن يحتوي على ?emp=رقم الموظف');
    } else {
      selectType('عادي');
      refreshMyStatus();
    }
  </script>
</body>
</html>
